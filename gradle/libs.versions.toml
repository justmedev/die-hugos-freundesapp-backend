[versions]
dotenv = "4.0.0"
exposed = "1.5.0"
h2 = "2.4.240"
konform = "0.11.1"
kotlin = "2.4.10"
ktorOpenApi = "5.7.0"
logback = "1.6.3"
mockk = "1.14.11"
schemaKenerator = "2.7.2"
version-catalog-update = "1.1.1"

[libraries]
argon2 = "de.mkammerer:argon2-jvm:2.12"
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
h2database-h2 = { module = "com.h2database:h2", version.ref = "h2" }
hayden-khealth = "dev.hayden:khealth:3.0.2"
konform = { module = "io.konform:konform", version.ref = "konform" }
ktor-openapi = { module = "io.github.smiley4:ktor-openapi", version.ref = "ktorOpenApi" }
ktor-swagger = { module = "io.github.smiley4:ktor-swagger-ui", version.ref = "ktorOpenApi" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
postgresql = "org.postgresql:postgresql:42.7.13"
schema-kenerator-core = { module = "io.github.smiley4:schema-kenerator-core", version.ref = "schemaKenerator" }
schema-kenerator-serialization = { module = "io.github.smiley4:schema-kenerator-serialization", version.ref = "schemaKenerator" }
schema-kenerator-swagger = { module = "io.github.smiley4:schema-kenerator-swagger", version.ref = "schemaKenerator" }

[plugins]
dotenv = { id = "co.uzzu.dotenv.gradle", version.ref = "dotenv" }
exposed = { id = "org.jetbrains.exposed.plugin", version.ref = "exposed" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
versionCatalogeUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
